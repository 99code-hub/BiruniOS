name: BiruniOS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: BiruniOS preview version
        required: true
        default: '0.1.0'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-iso:
    name: Compose Fedora 45 KDE live/install ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo 'Disk before cleanup:'
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet || true
          sudo docker system prune -af || true
          echo 'Disk after cleanup:'
          df -h /

      - name: Build Fedora 45 compose container
        run: docker build -f ci/Fedora45.Dockerfile -t birunios-builder:${{ github.sha }} .

      - name: Build BiruniOS ISO
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="0.1.0"; fi
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env BIRUNIOS_VERSION="$VERSION" \
            --env FEDORA_RELEASE=45 \
            --env GITHUB_SHA="$GITHUB_SHA" \
            --entrypoint /bin/bash \
            birunios-builder:${{ github.sha }} \
            /workspace/scripts/build-iso.sh

      - name: Inspect ISO and checksum
        run: |
          ISO_FILE="$(find build/out -maxdepth 1 -type f -name 'BiruniOS-*.iso' -size +0c -print -quit)"
          test -n "$ISO_FILE"
          test -s build/out/SHA256SUMS
          test -s build/out/BUILD-INFO.txt
          (cd build/out && sha256sum --check SHA256SUMS)
          cat build/out/BUILD-INFO.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiruniOS-ISO-${{ github.ref_name }}-${{ github.sha }}
          path: build/out/*
          if-no-files-found: error
          retention-days: 30

      - name: Prepare GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/prepare-release-assets.sh

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/release-assets/*
          prerelease: true
