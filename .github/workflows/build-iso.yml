
name: BiruniOS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'BiruniOS version (example: 0.1.0)'
        required: true
        default: '0.1.0'
        type: string

  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: birunios-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build and publish BiruniOS prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate and resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RAW_VERSION="$INPUT_VERSION"
          else
            RAW_VERSION="$GITHUB_REF_NAME"
          fi

          VERSION="${RAW_VERSION#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
            echo "ERROR: Invalid BiruniOS version: $RAW_VERSION"
            echo "Example: 0.1.0 or 0.2.0-rc.1"
            exit 1
          fi

          TAG_NAME="v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "BiruniOS version: $VERSION"
          echo "Release tag: $TAG_NAME"

      - name: Check that version has not already been released
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if git ls-remote --exit-code --refs origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${TAG_NAME} already exists."
            echo "Choose a new version instead of reusing an old release."
            exit 1
          else
            STATUS=$?

            if [[ "$STATUS" -ne 2 ]]; then
              echo "ERROR: Unable to check remote Git tags."
              exit "$STATUS"
            fi
          fi

          echo "Version ${TAG_NAME} is available."

      - name: Free runner disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /

          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet || true

          sudo docker system prune -af || true

          echo "Disk after cleanup:"
          df -h /

      - name: Build Fedora 45 compose container
        shell: bash
        run: |
          set -Eeuo pipefail

          docker build \
            -f ci/Fedora45.Dockerfile \
            -t "birunios-builder:${GITHUB_SHA}" \
            .

      - name: Build BiruniOS ISO
        env:
          BIRUNIOS_VERSION: ${{ steps.version.outputs.version }}
          FEDORA_RELEASE: '45'
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env "BIRUNIOS_VERSION=$BIRUNIOS_VERSION" \
            --env "FEDORA_RELEASE=$FEDORA_RELEASE" \
            --env "GITHUB_SHA=$GITHUB_SHA" \
            --entrypoint /bin/bash \
            "birunios-builder:${GITHUB_SHA}" \
            /workspace/scripts/build-iso.sh

      - name: Restore build output ownership
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -d build ]]; then
            sudo chown -R "$(id -u):$(id -g)" build
          fi

      - name: Inspect ISO and verify checksum
        shell: bash
        run: |
          set -Eeuo pipefail

          ISO_FILE="$(
            find build/out \
              -maxdepth 1 \
              -type f \
              -name 'BiruniOS-*.iso' \
              -size +0c \
              -print -quit
          )"

          if [[ -z "$ISO_FILE" ]]; then
            echo "ERROR: BiruniOS ISO was not found."
            exit 1
          fi

          test -s build/out/SHA256SUMS
          test -s build/out/BUILD-INFO.txt

          (
            cd build/out
            sha256sum --check SHA256SUMS
          )

          echo "ISO successfully verified:"
          ls -lh "$ISO_FILE"

          echo
          cat build/out/BUILD-INFO.txt

      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BiruniOS-ISO-${{ steps.version.outputs.tag_name }}-${{ github.sha }}
          path: build/out/*
          if-no-files-found: error
          retention-days: 30

      - name: Prepare GitHub Release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/prepare-release-assets.sh

      - name: Publish BiruniOS GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: BiruniOS ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            build/release-assets/*
